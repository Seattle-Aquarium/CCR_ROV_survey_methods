<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Installed into the web demo's container as /etc/fonts/conf.d/50-montserrat.conf.

  Tk on X11 asks fontconfig for weight "medium" whenever it wants ordinary
  text, and Montserrat has a Medium face (bundled for the headings), so every
  line of body text would be drawn in it. This keeps body text in the Regular
  face, as on Windows. The headings name "Montserrat Medium" and "Montserrat
  SemiBold" outright and are not touched.

  XML allows no double hyphen inside a comment: one here and fontconfig skips
  the whole file, saying so only on stderr.
-->
<fontconfig>
  <match target="pattern">
    <test name="family" compare="eq"><string>Montserrat</string></test>
    <test name="weight" compare="eq"><const>medium</const></test>
    <edit name="weight" mode="assign"><const>regular</const></edit>
  </match>
</fontconfig>
