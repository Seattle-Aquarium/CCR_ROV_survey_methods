[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ccr-m2c"
version = "1.0.0"
description = "Turn BlueOS .mcap recordings into per-transect CSVs and a Leaflet map"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Seattle Aquarium, Coastal Climate Resilience" }]

# Deliberately not published to PyPI: this is installed from a checkout with
# `pip install -e .`. The import name is prefixed because a *different* package
# called `m2c` already exists on PyPI, and an unprefixed name would let
# `python -m m2c` silently run someone else's program.
dependencies = [
  "mcap>=1.1",
  "zstandard>=0.21",
  "pandas>=2.0",
  "numpy>=1.24",
  "pytz>=2023.3",
  "geopy>=2.3",
  "scipy>=1.10",
  "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pyinstaller>=6"]

[project.scripts]
ccr-m2c = "ccr_m2c.cli:main"

[project.gui-scripts]
ccr-m2c-gui = "ccr_m2c.gui:main"

[tool.setuptools]
packages = ["ccr_m2c"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Deliberately 100 rather than UTC's 88. The substantive rule families below
# match UTC exactly -- those are the ones that catch bugs. Holding this package
# to 88 as well would have meant re-wrapping 74 lines of freshly written code,
# burying the handful of real fixes in a reformatting diff. Worth narrowing to
# 88 later, as a change of its own.
line-length = 100
target-version = "py310"
exclude = ["build", "dist", "assets"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle
    "F",     # pyflakes — undefined names, unused imports
    "I",     # import sorting
    "B",     # bugbear — likely bugs
    "UP",    # pyupgrade
]

[tool.ruff.lint.per-file-ignores]
# mapping.py embeds the Leaflet map's CSS and JavaScript as string literals.
# Their lines are long, and a "# noqa" there would be inserted into the
# generated HTML rather than read by ruff -- so the file is exempted here.
"ccr_m2c/mapping.py" = ["E501"]
