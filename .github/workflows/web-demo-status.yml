name: Web demo status

# What the web demo's Fly machine is doing, without deploying anything: its
# state, its recent events (started, suspended, resumed) and the end of its
# log. Run from the Actions tab once this is on the default branch; until then
# it runs when this file is pushed. This repository's logs are public, so
# addresses are masked before anything is printed.
on:
  push:
    branches: [claude/sim-web-demo-b7601e]
    paths:
      - ".github/workflows/web-demo-status.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@1.6
      - run: |
          mask() {
            sed -E -e 's/[0-9]{1,3}(\.[0-9]{1,3}){3}/x.x.x.x/g' \
                   -e 's/([0-9a-fA-F]{1,4}:){4,7}[0-9a-fA-F]{0,4}/x:x:x:x/g'
          }
          app=$(sed -n 's/^app = "\(.*\)"/\1/p' rov_flight_ops/web_demo/fly.toml)
          flyctl machine list --app "$app" | mask
          for id in $(flyctl machine list --app "$app" --json | jq -r '.[].id'); do
            echo "== machine $id"
            flyctl machine status "$id" --app "$app" | mask
          done
          echo "== log"
          flyctl logs --app "$app" --no-tail | tail -n 150 | mask
